org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=2
org.gradle.parallel=false
android.useAndroidX=true
# Pub packages can be on a different Windows drive from the project.
# Kotlin's relative incremental cache paths cannot cross drive roots.
kotlin.incremental=false
