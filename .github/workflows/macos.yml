name: Build macOS test app
on:
  workflow_dispatch:
    inputs:
      architecture:
        description: Target Mac processor.
        type: choice
        options: [arm64, x64]
        default: arm64
      official:
        description: Include the existing client parsing and search configuration.
        type: boolean
        default: true
  push:
    branches: ['codex/macos-arm64-*']
  pull_request:
    branches: [main, master]
    paths: ['macos/**', 'lib/**', 'native/**', 'vendor_plugins/**', 'tool/**', 'pubspec*', '.github/workflows/macos.yml']
permissions:
  contents: read
concurrency:
  group: macos-${{ github.ref }}-${{ inputs.architecture || 'arm64' }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ${{ inputs.architecture == 'x64' && 'macos-15-intel' || 'macos-15' }}
    environment: ${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.official)) && 'release' || '' }}
    timeout-minutes: 60
    env:
      ASTERLINK_MACOS_ARCHITECTURE: ${{ inputs.architecture || 'arm64' }}
      ASTERLINK_MACOS_MACH_ARCH: ${{ inputs.architecture == 'x64' && 'x86_64' || 'arm64' }}
      PUB_HOSTED_URL: https://pub.dev
      FLUTTER_STORAGE_BASE_URL: https://storage.googleapis.com
      GOPROXY: https://proxy.golang.org,direct
      GOTOOLCHAIN: go1.24.7
      ASTERLINK_CONTROL_URL: ${{ secrets.ASTERLINK_CONTROL_URL || vars.ASTERLINK_CONTROL_URL }}
      ASTERLINK_GITHUB_REPO: ${{ vars.ASTERLINK_GITHUB_REPO || github.repository }}
      ASTERLINK_APPLICATION_ID: ${{ vars.ASTERLINK_APPLICATION_ID }}
      UMENG_APPKEY: ${{ secrets.UMENG_APPKEY }}
      UMENG_CHANNEL: ${{ vars.UMENG_CHANNEL || 'github' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Cache native test compilation
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/Library/Caches/go-build
          key: macos-${{ env.ASTERLINK_MACOS_ARCHITECTURE }}-go-1.24.7-${{ hashFiles('native/gopeed/go.sum', 'native/gopeed/**/*.go') }}
          restore-keys: macos-${{ env.ASTERLINK_MACOS_ARCHITECTURE }}-go-1.24.7-
      - name: Verify source and configure macOS
        run: |
          test "$(uname -m)" = "$ASTERLINK_MACOS_MACH_ARCH"
          python tool/check_public_files.py --staged
          dart tool/sync_version.dart --check
          flutter config --no-enable-swift-package-manager
          python -c "from pathlib import Path; p=Path('pubspec.lock'); p.write_text(p.read_text().replace('https://pub.flutter-io.cn', 'https://pub.dev'))"
      - name: Prepare existing client configuration
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.official)
        env:
          ASTERLINK_CLIENT_DEFINES_JSON: ${{ secrets.ASTERLINK_CLIENT_DEFINES_JSON }}
        run: |
          test "$ASTERLINK_APPLICATION_ID" = com.asterlink.app
          test -n "$ASTERLINK_CONTROL_URL"
          python tool/prepare-ci-release.py
      - name: Build macOS client
        shell: pwsh
        run: ./tool/build-macos.ps1 -Architecture "$env:ASTERLINK_MACOS_ARCHITECTURE"
      - name: Inspect and package macOS app
        run: |
          python tool/package-macos.py --app build/macos/Build/Products/Release/文析助手.app --architecture "$ASTERLINK_MACOS_ARCHITECTURE"
      - name: Save test installers only
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: macos-${{ env.ASTERLINK_MACOS_ARCHITECTURE }}-test
          path: .local/macos-release-assets/*
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
