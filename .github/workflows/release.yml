name: Build signed release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  tag:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Check version and release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            dart tool/sync_version.dart --check --tag "$RELEASE_TAG"
          else
            dart tool/sync_version.dart --check
          fi
  native-check:
    needs: tag
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.24.7'
          cache: false
      - name: Recheck deterministic native preview parallelism and resume
        shell: bash
        working-directory: native/gopeed
        env:
          CGO_ENABLED: '0'
          GOTOOLCHAIN: local
        run: go test -p=1 -mod=vendor -tags nosqlite -ldflags=-checklinkname=0 ./bind/asterlink -run '^TestBaiduPreviewBoundedRequestsAndRestart$' -count=3 -timeout=180s
