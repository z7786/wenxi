name: Build signed release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  tag:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Check version and release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            dart tool/sync_version.dart --check --tag "$RELEASE_TAG"
          else
            dart tool/sync_version.dart --check
          fi
  checks:
    needs: tag
    uses: ./.github/workflows/checks.yml
  package:
    needs: [tag, checks]
    runs-on: windows-2022
    environment: release
    permissions:
      contents: read
      actions: write
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        target: [android, windows]
    env:
      PUB_HOSTED_URL: https://pub.dev
      FLUTTER_STORAGE_BASE_URL: https://storage.googleapis.com
      GOPROXY: https://proxy.golang.org,direct
      GOTOOLCHAIN: go1.24.7
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g
      ASTERLINK_CONTROL_URL: ${{ secrets.ASTERLINK_CONTROL_URL || vars.ASTERLINK_CONTROL_URL }}
      ASTERLINK_GITHUB_REPO: ${{ vars.ASTERLINK_GITHUB_REPO || github.repository }}
      ASTERLINK_APPLICATION_ID: ${{ vars.ASTERLINK_APPLICATION_ID }}
      UMENG_APPKEY: ${{ secrets.UMENG_APPKEY || vars.UMENG_APPKEY }}
      UMENG_CHANNEL: ${{ vars.UMENG_CHANNEL || 'github' }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          android: ${{ matrix.target == 'android' && 'true' || 'false' }}
      - name: Require official release configuration
        run: |
          if ($env:ASTERLINK_APPLICATION_ID -ne 'com.asterlink.app' -or
              -not $env:ASTERLINK_CONTROL_URL -or -not $env:UMENG_APPKEY) {
            throw 'Configure the original application ID, control URL and statistics key in the release environment.'
          }
      - name: Prepare Android signing files
        if: matrix.target == 'android'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python tool/prepare-ci-release.py --android
      - name: Prepare Windows release settings
        if: matrix.target == 'windows'
        run: python tool/prepare-ci-release.py
      - name: Build, test and inspect Android
        if: matrix.target == 'android'
        run: |
          $sdkmanager = Join-Path $env:ANDROID_HOME 'cmdline-tools/latest/bin/sdkmanager.bat'
          & $sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
          if ($LASTEXITCODE -ne 0) { throw 'Android SDK installation failed.' }
          ./tool/build-android.ps1
          $settings = Get-Content -LiteralPath .local/build-config.json -Raw | ConvertFrom-Json
          python tool/verify_apk.py --apk build/app/outputs/flutter-apk/app-release.apk --sdk $env:ANDROID_HOME --application-id $settings.applicationId --umeng-channel $settings.metricsChannel --output .local/release-apk-inspection.json
          if ($LASTEXITCODE -ne 0) { throw 'APK inspection failed.' }
      - name: Test Android release code and stage APK
        if: matrix.target == 'android'
        run: |
          $settings = Get-Content -LiteralPath .local/build-config.json -Raw | ConvertFrom-Json
          $env:ORG_GRADLE_PROJECT_ASTERLINK_UNSIGNED = 'false'
          $env:ORG_GRADLE_PROJECT_ASTERLINK_APPLICATION_ID = $settings.applicationId
          $env:ORG_GRADLE_PROJECT_UMENG_APPKEY = $settings.metricsAppKey
          $env:ORG_GRADLE_PROJECT_UMENG_CHANNEL = $settings.metricsChannel
          $env:GRADLE_USER_HOME = Join-Path $env:GITHUB_WORKSPACE '.local/gradle-home'
          & ./android/gradlew.bat -p android :app:testReleaseUnitTest -Ptarget-platform=android-arm64 --no-daemon
          if ($LASTEXITCODE -ne 0) { throw 'Android unit tests failed.' }
          python tool/package-release.py --platform android
      - name: Build Windows portable package and installer
        if: matrix.target == 'windows'
        run: |
          ./tool/build-windows.ps1
          $setup = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3.exe'
          Invoke-WebRequest -Uri 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $setup
          if ((Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash -ne '9C73C3BAE7ED48D44112A0F48E66742C00090BDB5BEF71D9D3C056C66E97B732') { throw 'Inno Setup checksum mismatch.' }
          $inno = Join-Path $env:RUNNER_TEMP 'inno-6.7.3'
          $install = Start-Process -FilePath $setup -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', ('/DIR="' + $inno + '"')) -Wait -PassThru -WindowStyle Hidden
          if ($install.ExitCode -ne 0) { throw 'Inno Setup installation failed.' }
          ./tool/build-windows-installer.ps1 -Iscc (Join-Path $inno 'ISCC.exe') -OutputDir .local/release-installer
          $installers = @(Get-ChildItem -LiteralPath .local/release-installer -Filter '*.exe' -File)
          if ($installers.Count -ne 1) { throw 'Expected one installer.' }
          python tool/package-release.py --platform windows --installer $installers[0].FullName
      - name: Save only release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-${{ matrix.target }}
          path: |
            .local/release-assets/*.apk
            .local/release-assets/*.exe
            .local/release-assets/*.zip
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Remove temporary signing files
        if: always() && matrix.target == 'android'
        run: |
          foreach ($path in @('.local/ci-release.jks', '.local/keystore.properties')) {
            if (Test-Path -LiteralPath $path) { Remove-Item -LiteralPath $path -Force }
          }
