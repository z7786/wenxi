name: asterlink
description: 文析助手，支持网盘解析、下载和 BT 在线播放。
publish_to: none
version: 2.1.0+210

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: 1.0.8
  flutter_svg: 2.3.0
  qr_flutter: 4.1.0
  dio: 5.11.1
  ffi: 2.2.0
  html: 0.15.7
  xml: 7.0.1
  flutter_markdown_plus: 1.0.12
  markdown: 7.3.1
  re_highlight: 0.0.3
  enough_convert: 1.7.1
  crypto: 3.0.7
  archive: 4.2.0
  pointycastle: 4.0.0
  asterlink_js:
    path: vendor_plugins/asterlink_js
  path: 1.9.1
  path_provider: 2.1.6
  flutter_inappwebview: 6.1.5
  flutter_secure_storage: 11.1.1
  file_selector: 1.1.0
  desktop_drop: 0.8.4
  media_kit: 1.2.6
  media_kit_video: 2.0.1
  media_kit_libs_video: 1.0.7
  open_filex: 4.7.0
  url_launcher: 6.3.2
  share_plus: 13.3.0
  window_manager: 0.5.2
  tray_manager: 0.5.3
  pinyin: 3.3.0

dev_dependencies:
  file_selector_android: ^0.5.2+6
  fake_async: 1.3.3
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
  shaders:
    - assets/shaders/liquid_glass.frag
  assets:
    - assets/icons/
    - assets/navigation/
    - assets/licenses/
    - assets/support/appreciation-code.png
dependency_overrides:
  desktop_drop:
    path: vendor_plugins/desktop_drop
  file_selector_android:
    path: vendor_plugins/file_selector_android
  media_kit:
    path: vendor_plugins/media_kit
  media_kit_libs_android_video:
    path: vendor_plugins/media_kit_libs_android_video
  media_kit_libs_windows_video:
    path: vendor_plugins/media_kit_libs_windows_video
  flutter_inappwebview_windows:
    path: vendor_plugins/flutter_inappwebview_windows
